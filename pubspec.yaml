name: network
description: >-
  A lightweight Dio wrapper that turns HTTP calls into typed, exhaustively
  handled results, with pluggable access-token refresh, header injection,
  and structured request/response logging.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=2.15.1 <3.0.0'

dependencies:
  dio: ^5.4.1
  logger: ^2.2.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.25.2
